<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stellaris Tech Tree</title>
<meta name="description" content="Browse the Stellaris technology tree: prerequisites, unlocks, weights and conditions, for vanilla and modded games.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2353d1c6' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2353d1c6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilex:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="row">
    <h1 class="brand"><span class="logo" aria-hidden="true"></span>Stellaris Tech Tree</h1>
    <label class="field">
      <span class="sr">Dataset</span>
      <select id="dataset" title="Dataset"></select>
    </label>
    <label class="btn ghost file" title="Open a techs.json generated by stellaris-tech">
      Open file…<input id="file" type="file" accept=".json,application/json">
    </label>
    <div class="spacer"></div>
    <div class="seg" role="tablist" aria-label="View">
      <button id="view-grid" role="tab" data-view="grid">Cards</button>
      <button id="view-graph" role="tab" data-view="graph">Graph</button>
    </div>
  </div>
  <div class="row">
    <nav id="areas" class="tabs" aria-label="Research area"></nav>
    <div class="spacer"></div>
    <div class="search">
      <input id="q" type="search" placeholder="Search techs, unlocks, keys…  ( / )" autocomplete="off" spellcheck="false">
      <span id="hits" class="hits"></span>
    </div>
    <button id="filters-btn" class="btn ghost" aria-expanded="false" aria-controls="filters">Filters<span id="filter-count" class="count"></span></button>
  </div>
  <div id="filters" class="filters" hidden>
    <fieldset>
      <legend>Show</legend>
      <label><input type="checkbox" data-flag="event" checked> Event / special techs</label>
      <label><input type="checkbox" data-flag="repeatable" checked> Repeatables</label>
    </fieldset>
    <fieldset>
      <legend>Only</legend>
      <label><input type="checkbox" data-only="is_rare"> Rare</label>
      <label><input type="checkbox" data-only="is_dangerous"> Dangerous</label>
      <label><input type="checkbox" data-only="is_start_tech"> Starting</label>
      <label><input type="checkbox" data-only="is_insight"> Insight</label>
    </fieldset>
    <fieldset id="tiers-fs">
      <legend>Tier</legend>
      <div id="tiers" class="chips"></div>
    </fieldset>
    <fieldset id="cats-fs">
      <legend>Category</legend>
      <div id="cats" class="chips"></div>
    </fieldset>
    <fieldset id="src-fs" hidden>
      <legend>Source</legend>
      <select id="source"><option value="">All sources</option></select>
    </fieldset>
    <button id="filters-reset" class="btn ghost small">Reset filters</button>
  </div>
</header>

<main class="main">
  <section id="content" class="content" aria-live="polite">
    <div id="status" class="status">Loading…</div>
  </section>
  <aside id="detail" class="detail" hidden aria-label="Technology details"></aside>
</main>

<footer id="meta" class="meta"></footer>

<script src="js/util.js"></script>
<script src="js/model.js"></script>
<script src="js/detail.js"></script>
<script src="js/grid.js"></script>
<script src="js/graph.js"></script>
<script src="js/app.js"></script>
</body>
</html>
